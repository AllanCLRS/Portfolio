about:
  title: "About"
  description: |
    A fullstack software engineer with an engineering degree from ECAM Lyon, I have spent the last four years on high-stakes projects: a public digital service processing several million company filings a year, and the complete rebuild of a leading business school's website.

    Beyond the code, I run projects: estimating, quoting, client relations and coordinating an evolutive maintenance contract with a 50k euro annual budget. That dual role taught me to arbitrate between technical debt, business needs and the budget actually available.
