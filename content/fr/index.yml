about:
  title: "À propos"
  description: |
    Ingénieur logiciel fullstack diplômé de l'ECAM Lyon, j'ai passé ces quatre dernières années sur des projets à fort enjeu : un service public numérique traitant plusieurs millions de formalités d'entreprises par an, et la refonte complète du site d'une grande école.

    Au-delà du code, je pilote : chiffrage, devis, relation client et coordination d'une maintenance évolutive dotée d'un budget annuel de 50 k€. Ce double rôle m'a appris à arbitrer entre la dette technique, le besoin métier et le budget réel.
